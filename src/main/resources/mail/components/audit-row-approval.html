<tr style="border-bottom: 1px solid #e2e8f0; font-size: 12px;">
    <td style="padding: 10px; font-weight: 600; color: #b45309;">{{issueType}}</td>
    <td style="padding: 10px;">{{itemDescription}}</td>
    <td style="padding: 10px; text-align: right; font-family: monospace;">{{expectedValue}} EGP</td>
    <td style="padding: 10px; text-align: right; font-family: monospace; font-weight: 700; color: #059669;">{{actualValue}} EGP</td>
    <td style="padding: 10px; font-size: 11px; line-height: 1.5;">
        <div style="direction: rtl; color: #1e293b;">{{arabicReason}}</div>
        <div style="direction: ltr; color: #64748b; margin-top: 3px;">{{englishReason}}</div>
    </td>
</tr>
