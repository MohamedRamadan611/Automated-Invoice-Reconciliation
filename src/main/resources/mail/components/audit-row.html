<tr class="audit-row">
    <td class="col-issue">
        <div class="issue-title {{issueClass}}">{{issueType}}</div>
        {{issueSubtitle}}
    </td>
    <td class="col-desc">
        <div class="item-description">{{itemDescription}}</div>
        {{skuBadge}}
    </td>
    <td class="col-price">
        {{priceDetails}}
    </td>
    <td class="col-reason">
        {{reasonBox}}
    </td>
</tr>
