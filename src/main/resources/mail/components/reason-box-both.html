<div style="background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 10px;">
    <div style="direction: rtl; text-align: right; font-size: 12px; line-height: 1.6; color: #0f172a; margin-bottom: 8px;">
        <strong style="color: #991b1b; display: inline-block; background: #fee2e2; padding: 1px 6px; border-radius: 4px; font-size: 10px; margin-left: 4px;">سبب الاعتراض (عربي):</strong>
        {{arabicReason}}
    </div>
    <div style="direction: ltr; text-align: left; font-size: 12px; line-height: 1.6; color: #334155; border-top: 1px dashed #cbd5e1; padding-top: 6px;">
        <strong style="color: #0369a1; display: inline-block; background: #e0f2fe; padding: 1px 6px; border-radius: 4px; font-size: 10px; margin-right: 4px;">Discrepancy Reason (English):</strong>
        {{englishReason}}
    </div>
</div>
