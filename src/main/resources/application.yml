spring:
  application:
    name: Automated-Invoice-Reconciliation
  threads:
    virtual:
      enabled: true
  ai:
    openai:
      base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
      api-key: ${GEMINI_API_KEY:${AI_API_KEY:${OPENAI_API_KEY:mock-key}}}
      chat:
        options:
          model: ${AI_MODEL:gemini-3.8-flash}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/reconciliation_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      continue-on-error: true
