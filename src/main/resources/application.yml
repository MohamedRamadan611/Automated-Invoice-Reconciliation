server:
  port: ${SERVER_PORT:8080}
logging:
  file:
    name: backend.log
spring:
  application:
    name: Automated-Invoice-Reconciliation
  threads:
    virtual:
      enabled: true
  ai:
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 500ms
        max-interval: 1500ms
    openai:
      base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
      api-key: ${GEMINI_API_KEY:${AI_API_KEY:${OPENAI_API_KEY:mock-key}}}
      chat:
        options:
          model: ${AI_MODEL:gemini-3.8-flash}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/reconciliation_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      continue-on-error: true
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

notification:
  manager-email: ${NOTIFICATION_MANAGER_EMAIL:mohamed.ramadan97116@gmail.com}
  vendor-default-email: ${NOTIFICATION_VENDOR_EMAIL:mohamed.ramadan61197@gmail.com}

app:
  mail:
    manager-email: ${MANAGER_EMAIL:mohamed.ramadan97116@gmail.com}
    default-vendor-email: ${DEFAULT_VENDOR_EMAIL:mohamed.ramadan61197@gmail.com}
    backend-url: ${BACKEND_URL:http://localhost:8080}
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
